leagues:
  EPL:
    football_data: E0
    feeder: E1            # nousijoiden Elo lasketaan alemmalta sarjatasolta
    odds_api: soccer_epl
  BUNDESLIGA:
    football_data: D1
    feeder: D2
    odds_api: soccer_germany_bundesliga
seasons_history: 6
first_history_season: 2020   # 2020/21
current_season: 2026         # 2026/27
elo_warmup_first_season: 2015
source_timezone: Europe/London  # football-data.co.uk:n kellonajat (todennettu, ks. docs/data_sources.md)

bankroll_split: {core: 0.90, big_wins: 0.10}   # big_wins = yläraja; sitova on monthly_budget_eur
core:
  ev_threshold: {h2h: 0.04, totals: 0.03}
  kelly_fraction: 0.25
  max_stake_per_bet: 0.015
  max_stake_per_round: 0.05
  divergence_warning_pp: 8
big_wins:
  enabled: false                 # vasta ytimen paperikauden portin jälkeen
  monthly_budget_eur: 50
  acca_max_legs: 4
  acca_fixed_stake_eur: 5
  require_positive_ev: true
devig_method: power
bookmakers:
  sharp: [pinnacle, betfair_ex_eu]
  user: [coolbet, unibet_se, betsson, nordicbet, leovegas_se, betfair_ex_eu, matchbook]   # The Odds API -avaimet
  # Pörssin palkkio voitosta: tehollinen kerroin = 1 + (k − 1)(1 − palkkio). OLETUKSIA, tarkista omalta tililtä.
  commission: {betfair_ex_eu: 0.05, matchbook: 0.02}
sharp_reference:
  historical: [pinnacle, betfair_exchange]   # ensisijainen ensin
  fallback: market_avg     # vain jos kumpaakaan ei ole; käyttö merkitään ja raportoidaan
schedule:
  morning_run: "09:00"
  lock_minutes_before_kickoff: 60

# available_at-arviot (ks. docs/data_sources.md). Varovaisia eli myöhäisiä.
availability:
  early_odds_collection_local_time: "18:00"   # pe/ti "afternoon" -> klo 18 Lontoon aikaa
  early_odds_min_minutes_before_kickoff: 90   # < lukitus (60 min), jotta backtest voi käyttää
  result_minutes_after_kickoff: 150
  xg_minutes_after_kickoff: 1440

http:
  user_agent: "bagent/0.1 (research; polite caching)"
  delay_seconds: 1.5
  current_season_max_age_hours: 12

# Ajallinen jako (PLAN 7). Testijakso ajetaan kerran, ei viritystä sen perusteella.
splits:
  train: [2020, 2021, 2022]
  validation: [2023]
  test: [2024, 2025]

# Vaiheen 2 katediagnostiikka: välittäjät, joiden kate on lähellä käyttäjän välittäjää.
# Veikkauksen omaa katetta ei ole historiallisessa datassa; synteettiset katteet kattavat vaihtelun.
margin_diagnostic:
  soft_books: [bet365, betandwin, william_hill]
  synthetic_margins: [0.03, 0.05, 0.07, 0.09, 0.11]

# The Odds API (todennettu 2026-11-07, ks. docs/data_sources.md). Ilmaistaso: 500 krediittiä/kk.
# Kulutus per sarjahaku = alueet × markkinat (eu × 2 = 2). Kaksi sarjaa = 4 krediittiä/snapshot.
# Koko eu-alue tallennetaan: se maksaa saman kuin pelkät terävät + käyttäjän välittäjät, ja
# vaiheen 4 konsensusstrategia (Kaunitz) tarvitsee useita välittäjiä.
odds_api:
  regions: [eu]
  markets: [h2h, totals]
  min_credits_reserve: 20
  stale_minutes: 180          # markkinan last_update tätä vanhempi -> ei odds-tauluun (haamukerroin)
  snapshot_dir: snapshots/odds_api   # versionhallinnassa: kontti on lyhytikäinen

# Vaihe 4 (PLAN 9.4). Testiajo käyttää näitä jäädytettyinä.
phase4:
  model_a: {xi: 0.0015, tau_early: 10.0}       # vaiheen 3 viritys (maalit)
  proxy_books:                                  # lähimpänä käyttäjän välittäjien parhaan kertoimen katetta
    1x2: [bet365, betandwin, william_hill]      # paras näistä: kate 3,7–4,5 % (käyttäjä ~3,0 %)
    ou25: [bet365]                              # ainoa pehmeä välittäjä yli/alle-datassa: 5,0 % (käyttäjä ~4,3 %)
  decorrelation_grid: [0.0, 0.5, 1.0, 2.0, 4.0]
  decorrelation_min_bets: 50                   # c:n valinnassa vähintään näin monta vetoa (EV ≥ 0)
  decorrelation_c: {1x2: 1.0, ou25: 1.0}        # valittu validoinnissa (vähintään 50 vetoa), jäädytetty testiä varten

# Paperikausi (PLAN 9.5–9.6): päivittäinen ajo lukitsee vihjeet ennustelokiin, rahaa ei laiteta.
paper:
  window_hours: 30           # lukitaan ottelut, jotka alkavat seuraavan 30 h aikana (päivittäinen ajo -> kerran)
  min_minutes_before_kickoff: 5
  sharp_live: [pinnacle, betfair_ex_eu]
  movement_train_seasons: [2020, 2021, 2022, 2023, 2024, 2025]
  log_path: paper/forecast_log.jsonl
  report_dir: paper/reports
