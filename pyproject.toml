[project]
name = "bagent"
version = "0.1.0"
description = "Valioliigan ja Bundesliigan todennäköisyysmalli ja vedonlyöntiagentti (ei aseta vetoja)."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "duckdb>=1.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pytz>=2024.1",
  "tabulate>=0.9",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bagent = "bagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: vaatii verkkoyhteyden (ohitetaan oletuksena)"]
addopts = "-m 'not network'"
filterwarnings = ["ignore:The inplace keyword:DeprecationWarning", "ignore::Warning:duckdb"]
