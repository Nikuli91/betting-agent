# Päivittäinen kerroinsnapshot The Odds API:sta (PLAN 5 ja 9.1).
# Raakavastaukset commitoidaan kansioon snapshots/odds_api/, koska kerroinliikettä ei voi kerätä jälkikäteen.
# Kulutus: 14 krediittiä per ajo (7 sarjaa × eu × 2 markkinaa), noin 420 kuukaudessa (ilmaistaso 500).
# Avain luetaan repon salaisuudesta ODDS_API_KEY; sitä ei tulosteta.
name: Kerroinsnapshot ja paperiajo

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC = 9:17 Suomen talviaikaa, 10:17 kesäaikaa
  workflow_dispatch: {}    # käsin ajo testausta varten

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Päättyneiden kausien CSV:t eivät muutu: välimuisti nopeuttaa ajoa (nykykausi ladataan aina uudelleen).
      - uses: actions/cache@v4
        with:
          path: data/raw/football_data
          key: fd-${{ github.run_id }}
          restore-keys: fd-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Asenna
        run: pip install -e .

      - name: Hae kertoimet
        id: fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # Raakavastaus tallentuu ennen jäsennystä, joten commit tehdään myös, jos jäsennys
        # epäonnistuu (esim. uusi joukkuenimi). Ajo merkitään silti epäonnistuneeksi.
        run: |
          set +e
          bagent odds snapshot
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Paperiajo (lukitse vihjeet) ja CLV-arvio
        id: paper
        if: always()   # tuntematon joukkue ohittaa vain oman ottelunsa; vanhaa snapshotia ei käytetä
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set +e
          bagent data build && bagent paper run && bagent paper evaluate
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commitoi snapshotit ja paperiloki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/odds_api
          [ -d paper ] && git add paper
          if git diff --cached --quiet; then
            echo "Ei uusia snapshotteja"
            exit 0
          fi
          git commit -m "Kerroinsnapshot ja paperiajo $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Tarkista tulokset
        if: steps.fetch.outputs.status != '0' || steps.paper.outputs.status != '0'
        run: |
          echo "snapshot: ${{ steps.fetch.outputs.status }}, paperiajo: ${{ steps.paper.outputs.status }}"
          exit 1
